<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B54C2"/>
      <stop offset="100%" stop-color="#182230"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Left accent stripe -->
  <rect x="0" y="0" width="8" height="630" fill="#1677FF"/>
  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="200" fill="#1677FF" opacity="0.06"/>
  <circle cx="150" cy="520" r="150" fill="#25D366" opacity="0.05"/>
  <!-- Main title -->
  <text x="600" y="230" font-family="Arial Black, sans-serif" font-size="96" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2">SenTechPLUS</text>
  <!-- Subtitle -->
  <text x="600" y="305" font-family="Arial, sans-serif" font-size="32" fill="#93C5FD" text-anchor="middle" letter-spacing="1">Boutique High-Tech · Dakar, Sénégal</text>
  <!-- Divider line -->
  <line x1="400" y1="340" x2="800" y2="340" stroke="#1677FF" stroke-width="2" opacity="0.6"/>
  <!-- Icon pills row -->
  <!-- Earbuds pill -->
  <rect x="280" y="365" width="180" height="52" rx="26" fill="white" opacity="0.12"/>
  <text x="370" y="398" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="white">🎧 Audio</text>
  <!-- Watch pill -->
  <rect x="510" y="365" width="180" height="52" rx="26" fill="white" opacity="0.12"/>
  <text x="600" y="398" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="white">⌚ Montres</text>
  <!-- Charger pill -->
  <rect x="740" y="365" width="180" height="52" rx="26" fill="white" opacity="0.12"/>
  <text x="830" y="398" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="white">⚡ Chargeurs</text>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="white" opacity="0.05"/>
  <!-- Bottom info -->
  <text x="200" y="590" font-family="Arial, sans-serif" font-size="22" fill="#93C5FD" text-anchor="middle">🚴 Livraison 2h Dakar</text>
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="22" fill="#93C5FD" text-anchor="middle">💳 Wave · Orange Money</text>
  <text x="1000" y="590" font-family="Arial, sans-serif" font-size="22" fill="#93C5FD" text-anchor="middle">🛡️ Garantie 12 mois</text>
  <!-- URL tag -->
  <text x="600" y="625" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.4" text-anchor="middle">sentechplus.sn</text>
</svg>